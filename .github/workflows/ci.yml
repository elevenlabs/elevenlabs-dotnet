name: ci
# Builds and tests every pull request and push to main. Publishes only when a version tag
# is pushed, after the tests pass: the same shape as Fern's own C# workflow. Push the tag to release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

env:
  # SDK identity baked in at generation time from the in-memory build context,
  # so the workflow never reads the .csproj at runtime.
  SDK_VERSION: '1.0.0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build
        run: dotnet build "src/ElevenLabs/ElevenLabs.csproj" -c Release
      - name: Test
        run: dotnet test "src/ElevenLabs.Test/ElevenLabs.Test.csproj"

  publish:
    needs: [test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Exchanged by NuGet/login for a short-lived API key
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the SDK version
        # The package version comes from the .csproj, so a tag naming another version would
        # publish one version under the other's release.
        run: |
          if [ "$RELEASE_TAG" != "v$SDK_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match the SDK version v$SDK_VERSION."
            exit 1
          fi
      - name: Check required publishing secrets
        id: secrets
        # Secrets cannot be referenced in a step-level `if:`, so read them into env here and skip
        # the publish steps (succeeding, not failing) when a required secret is unset or empty.
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          # Trusted publishing mints the API key from this workflow's OIDC token, so the only
          # secret still needed is the nuget.org account the package belongs to.
          if [ -n "$NUGET_USER" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NUGET_USER is not set; skipping NuGet publishing."
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          dotnet-version: '9.0.x'
      - name: NuGet login (OIDC to short-lived API key)
        id: login
        if: steps.secrets.outputs.ok == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: steps.secrets.outputs.ok == 'true'
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No NuGet API key to publish with: NuGet/login returned none."
            exit 1
          fi
          dotnet pack "src/ElevenLabs/ElevenLabs.csproj" -c Release -o ./artifacts
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      - name: Create GitHub release
        if: steps.secrets.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
