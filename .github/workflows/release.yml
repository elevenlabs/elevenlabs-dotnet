name: Release

# Runs only when a GitHub release is published, never on a push to main. Hand-written and listed in
# .fernignore: the generated workflow created the version tag on every push to main that touched a
# .csproj, and packed only the core package.
#
# Publishes both packages to NuGet with trusted publishing (OIDC): NuGet/login exchanges this job's
# GitHub token for a short-lived API key. The nuget.org trusted publishing policy must name this
# repository and this workflow file, and cover both package IDs.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Exchanged by NuGet/login for a short-lived API key
    env:
      TAG: ${{ github.event.release.tag_name }}
      PROJECTS: >-
        src/ElevenLabs/ElevenLabs.csproj
        src/ElevenLabs.AspNetCore/ElevenLabs.AspNetCore.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Check the tag matches both package versions
        run: |
          version="${TAG#v}"
          status=0
          for project in $PROJECTS; do
            project_version=$(dotnet msbuild "$project" -getProperty:Version)
            if [ "$project_version" != "$version" ]; then
              echo "::error::$project is version $project_version, but the release tag is $TAG."
              status=1
            fi
          done
          exit $status

      - name: Check the nuget.org account is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the NUGET_USER secret to the nuget.org account that owns the trusted publishing policy."
            exit 1
          fi

      - name: Pack
        run: |
          for project in $PROJECTS; do
            dotnet pack "$project" -c Release -o ./artifacts
          done
          ls -l ./artifacts

      - name: NuGet login (OIDC to short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # --skip-duplicate makes a re-run safe after a partial push.
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
